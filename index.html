<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KMA Films — Catalog</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="images/default-poster.jpg" />
</head>
<body>
  <header class="nav">
    <div class="brand">KMA<span>Films</span></div>
    <nav class="menu">
      <a href="#" class="active">Каталог</a>
      <a href="#" id="open-add">Додати</a>
      <a href="#" id="about">Про</a>
    </nav>
  </header>

  <section class="toolbar">
    <input id="search" type="text" placeholder="Пошук за назвою або режисером..." />
    <select id="genre">
      <option value="">Всі жанри</option>
      <option>Action</option>
      <option>Adventure</option>
      <option>Drama</option>
      <option>Comedy</option>
      <option>Crime</option>
      <option>Romance</option>
      <option>Fantasy</option>
      <option>Sci-Fi</option>
      <option>Thriller</option>
    </select>
    <button id="reload" class="btn">Оновити</button>
  </section>

  <main id="grid" class="grid">

  </main>

  <footer class="footer">
    <div>© 2025 KMA Films</div>
    <div>API: /movies</div>
  </footer>

  <!-- Modal add form -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3>Додати фільм</h3>
      <form id="add-form">
        <div class="field">
          <label>Назва</label>
          <input name="title" required />
        </div>
        <div class="field">
          <label>Опис</label>
          <textarea name="description" rows="3"></textarea>
        </div>
        <div class="row">
          <div class="field">
            <label>Режисер</label>
            <input name="director" />
          </div>
          <div class="field">
            <label>Рік</label>
            <input name="year" type="number" min="1888" max="2100" />
          </div>
          <div class="field">
            <label>Рейтинг</label>
            <input name="rating" type="number" step="0.1" min="0" max="10" />
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label>Країна</label>
            <input name="country" />
          </div>
          <div class="field">
            <label>Жанр</label>
            <input name="genre" placeholder="Action, Drama" />
          </div>
        </div>
        <div class="actions">
          <button type="button" id="close-modal" class="btn ghost">Закрити</button>
          <button type="submit" class="btn">Зберегти</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    window.API_BASE = "http://127.0.0.1:8000";
  </script>
  <script src="script.js"></script>
</body>
</html>
